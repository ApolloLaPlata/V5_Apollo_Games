<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>V5 Live: Cabo de Guerra Neon (9:16)</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      background-color: #020617;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      width: 100vw;
      height: 100vh;
    
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
    }

    /* Container 9:16 Estrito Responsivo */
    #game-stage {
      position: relative;
      width: 100vw;
      height: 100vh;
      max-width: calc(100vh * (9 / 16));
      background: radial-gradient(circle at 50% 30%, #0f172a 0%, #020617 100%);
      border: 1px solid rgba(255, 255, 255, 0.08);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      overflow: hidden;
      box-shadow: 0 0 50px rgba(0, 0, 0, 0.9);
    }

    /* Top Safe Zone (140px) */
    .top-header {
      padding: 18px 16px 8px 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      z-index: 10;
      background: linear-gradient(180deg, rgba(2, 6, 23, 0.95) 0%, rgba(2, 6, 23, 0) 100%);
    }

    .brand-row {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .brand-tag {
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: #94a3b8;
      font-family: monospace;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .live-dot {
      width: 8px;
      height: 8px;
      background: #10b981;
      border-radius: 50%;
      box-shadow: 0 0 10px #10b981;
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.85); }
    }

    .timer-badge {
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid rgba(239, 68, 68, 0.4);
      color: #fca5a5;
      font-size: 13px;
      font-weight: 800;
      padding: 4px 12px;
      border-radius: 20px;
      font-variant-numeric: tabular-nums;
      display: flex;
      align-items: center;
      gap: 5px;
    }

    /* Placar Triplo Neon */
    .score-board {
      width: 100%;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      align-items: center;
      background: rgba(15, 23, 42, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 16px;
      padding: 10px 16px;
      backdrop-filter: blur(10px);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
    }

    .team-box {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .team-blue {
      color: #38bdf8;
      text-shadow: 0 0 14px rgba(56, 189, 248, 0.6);
    }

    .team-orange {
      color: #fb923c;
      text-shadow: 0 0 14px rgba(251, 146, 60, 0.6);
    }

    .box-title {
      font-size: 11px;
      text-transform: uppercase;
      font-weight: 800;
      letter-spacing: 1px;
      opacity: 0.85;
    }

    .box-score {
      font-size: 22px;
      font-weight: 900;
      font-family: monospace;
      margin-top: 2px;
    }

    /* Arena Central da Corda (Canvas 2D) */
    #arena-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    /* Bottom Safe Zone (180px) */
    .bottom-panel {
      padding: 12px 16px 20px 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      z-index: 10;
      background: linear-gradient(0deg, rgba(2, 6, 23, 0.98) 0%, rgba(2, 6, 23, 0.7) 70%, rgba(2, 6, 23, 0) 100%);
      pointer-events: none;
    }

    .chat-instructions {
      display: flex;
      justify-content: space-between;
      gap: 8px;
    }

    .cmd-pill {
      flex: 1;
      background: rgba(30, 41, 59, 0.8);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 12px;
      padding: 10px 8px;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
    }

    .cmd-pill.blue {
      border-color: rgba(56, 189, 248, 0.4);
      background: rgba(56, 189, 248, 0.1);
    }

    .cmd-pill.orange {
      border-color: rgba(251, 146, 60, 0.4);
      background: rgba(251, 146, 60, 0.1);
    }

    .cmd-key {
      font-size: 16px;
      font-weight: 900;
      font-family: monospace;
    }

    .cmd-desc {
      font-size: 10px;
      color: #cbd5e1;
      font-weight: 700;
      text-transform: uppercase;
    }

    .gift-cta {
      background: linear-gradient(90deg, rgba(234, 88, 12, 0.25) 0%, rgba(251, 191, 36, 0.3) 50%, rgba(234, 88, 12, 0.25) 100%);
      border: 1px solid rgba(251, 191, 36, 0.4);
      border-radius: 12px;
      padding: 8px 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 0 15px rgba(251, 191, 36, 0.2);
    }

    .gift-cta-text {
      font-size: 11px;
      font-weight: 700;
      color: #fef08a;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .gift-badge {
      background: #f59e0b;
      color: #000000;
      font-weight: 900;
      font-size: 10px;
      padding: 3px 8px;
      border-radius: 8px;
    }

    /* Feed de Presentes / Toasts */
    .toast-container {
      position: absolute;
      top: 145px;
      width: calc(100% - 32px);
      left: 16px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      pointer-events: none;
      z-index: 20;
    }

    .toast-item {
      background: rgba(15, 23, 42, 0.92);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 10px;
      padding: 8px 12px;
      font-size: 12px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: space-between;
      backdrop-filter: blur(8px);
      animation: slideDown 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
      box-shadow: 0 6px 16px rgba(0, 0, 0, 0.5);
    }

    @keyframes slideDown {
      from { opacity: 0; transform: translateY(-15px) scale(0.95); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    /* Overlay de Vitória / Auto-Reset (5 Segundos) */
    #victory-overlay {
      position: absolute;
      inset: 0;
      background: rgba(2, 6, 23, 0.92);
      backdrop-filter: blur(12px);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 24px;
      z-index: 100;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.4s ease;
    }

    #victory-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .victory-box {
      background: rgba(15, 23, 42, 0.95);
      border: 2px solid #fbbf24;
      border-radius: 24px;
      padding: 32px 24px;
      width: 100%;
      max-width: 380px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      box-shadow: 0 0 50px rgba(251, 191, 36, 0.35);
      animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
    }

    @keyframes popIn {
      0% { transform: scale(0.7); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }

    .victory-crown {
      font-size: 52px;
      margin-bottom: 10px;
      animation: bounce 1s infinite alternate ease-in-out;
    }

    @keyframes bounce {
      from { transform: translateY(0); }
      to { transform: translateY(-10px); }
    }

    .victory-title {
      font-size: 26px;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 8px;
    }

    .victory-score-detail {
      font-size: 15px;
      color: #94a3b8;
      margin-bottom: 20px;
    }

    .reset-progress-bar {
      width: 100%;
      height: 8px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 4px;
      overflow: hidden;
      margin-top: 15px;
    }

    .reset-progress-fill {
      height: 100%;
      background: #fbbf24;
      width: 0%;
      transition: width 5s linear;
    }

    /* Gaveta de Depuração Local (Tecla 'D') */
    #debug-drawer {
      position: absolute;
      bottom: 12px;
      left: 12px;
      right: 12px;
      background: rgba(15, 23, 42, 0.95);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 14px;
      padding: 10px;
      display: none;
      flex-direction: column;
      gap: 6px;
      z-index: 200;
      pointer-events: auto;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8);
    }

    .debug-buttons {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 5px;
    }

    .debug-btn {
      background: #1e293b;
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #f1f5f9;
      font-size: 10px;
      font-weight: 700;
      padding: 7px 4px;
      border-radius: 8px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div id="game-stage">
    
    <!-- Top Safe Zone -->
    <header class="top-header">
      <div class="brand-row">
        <div class="brand-tag">
          <span class="live-dot"></span>
          V5 LIVE CABO DE GUERRA
        </div>
        <div class="timer-badge">
          ⏳ <span id="round-timer">45</span>s
        </div>
      </div>

      <div class="score-board">
        <div class="team-box team-blue">
          <span class="box-title">🔵 Time Azul</span>
          <span class="box-score" id="score-blue">0</span>
        </div>
        <div class="team-box team-orange">
          <span class="box-title">🟠 Time Laranja</span>
          <span class="box-score" id="score-orange">0</span>
        </div>
      </div>
    </header>

    <!-- Canvas Central da Arena -->
    <div id="arena-container">
      <canvas id="arena-canvas"></canvas>
    </div>

    <!-- Feed de Notificações / Toasts -->
    <div class="toast-container" id="toast-container"></div>

    <!-- Bottom Safe Zone -->
    <footer class="bottom-panel">
      <div class="chat-instructions">
        <div class="cmd-pill blue">
          <span class="cmd-key team-blue">1</span>
          <span class="cmd-desc">Puxar Azul</span>
        </div>
        <div class="cmd-pill orange">
          <span class="cmd-key team-orange">2</span>
          <span class="cmd-desc">Puxar Laranja</span>
        </div>
      </div>

      <div class="gift-cta">
        <div class="gift-cta-text">
          🎁 <span>Presentes = Super Tração (5x a 50x de Força!)</span>
        </div>
        <span class="gift-badge">SUPER BOOST</span>
      </div>
    </footer>

    <!-- Overlay de Vitória -->
    <div id="victory-overlay">
      <div class="victory-box">
        <div class="victory-crown" id="victory-icon">👑</div>
        <h2 class="victory-title" id="victory-title">TIME AZUL VENCEU!</h2>
        <p class="victory-score-detail" id="victory-detail">Placar: 12 vitórias acumuladas</p>
        <p style="font-size: 12px; color: #cbd5e1; font-weight: 600;">Reiniciando próxima rodada...</p>
        <div class="reset-progress-bar">
          <div class="reset-progress-fill" id="reset-fill"></div>
        </div>
      </div>
    </div>

    <!-- Painel de Depuração Local -->
    <div id="debug-drawer">
      <div style="font-size: 11px; font-weight: 800; color: #94a3b8; display: flex; justify-content: space-between;">
        <span>🎮 Painel de Testes [D]</span>
        <span style="cursor:pointer;" onclick="toggleDebug()">✕ Fechar</span>
      </div>
      <div class="debug-buttons">
        <button class="debug-btn" onclick="pull('A', 1, '@streamer')">🔵 Puxar Azul (1)</button>
        <button class="debug-btn" onclick="pull('B', 1, '@streamer')">🟠 Puxar Laranja (2)</button>
        <button class="debug-btn" onclick="pull('A', 15, '@vip_rosa', 'Rosa')">🌸 Gift Rosa (+15)</button>
        <button class="debug-btn" onclick="pull('B', 50, '@vip_leao', 'Leão')">🦁 Gift Leão (+50)</button>
        <button class="debug-btn" onclick="endRound('A')">🏆 Vitória Azul</button>
        <button class="debug-btn" onclick="endRound('B')">🏆 Vitória Laranja</button>
      </div>
    </div>

  </div>

  <script>
    /**
     * V5 SYNTH AUDIO PROCEDURAL ENGINE
     */
    class V5AudioEngine {
      constructor() {
        this.ctx = null;
      }
      getCtx() {
        if (!this.ctx) {
          const AudioContextClass = window.AudioContext || window.webkitAudioContext;
          this.ctx = new AudioContextClass();
        }
        if (this.ctx.state === 'suspended') this.ctx.resume().catch(() => {});
        return this.ctx;
      }
      playTug() {
        try {
          const c = this.getCtx();
          const t = c.currentTime;
          const osc = c.createOscillator();
          const g = c.createGain();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(140, t);
          osc.frequency.exponentialRampToValueAtTime(50, t + 0.12);
          g.gain.setValueAtTime(0.25, t);
          g.gain.exponentialRampToValueAtTime(0.01, t + 0.12);
          osc.connect(g);
          g.connect(c.destination);
          osc.start(t);
          osc.stop(t + 0.12);
        } catch (e) {}
      }
      playCoin() {
        try {
          const c = this.getCtx();
          const t = c.currentTime;
          const osc = c.createOscillator();
          const g = c.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(987, t);
          osc.frequency.setValueAtTime(1318, t + 0.08);
          g.gain.setValueAtTime(0.2, t);
          g.gain.exponentialRampToValueAtTime(0.001, t + 0.3);
          osc.connect(g);
          g.connect(c.destination);
          osc.start(t);
          osc.stop(t + 0.3);
        } catch (e) {}
      }
      playSuperPull() {
        try {
          const c = this.getCtx();
          const t = c.currentTime;
          const osc = c.createOscillator();
          const g = c.createGain();
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(260, t);
          osc.frequency.exponentialRampToValueAtTime(70, t + 0.35);
          g.gain.setValueAtTime(0.35, t);
          g.gain.exponentialRampToValueAtTime(0.001, t + 0.35);
          osc.connect(g);
          g.connect(c.destination);
          osc.start(t);
          osc.stop(t + 0.35);
        } catch (e) {}
      }
      playEpicVictoryJingle() {
        try {
          const c = this.getCtx();
          const t = c.currentTime;
          const notes = [
            { f: 392.00, st: 0.00, d: 0.18 },
            { f: 392.00, st: 0.22, d: 0.18 },
            { f: 392.00, st: 0.44, d: 0.18 },
            { f: 523.25, st: 0.68, d: 0.65 },
            { f: 659.25, st: 1.35, d: 0.40 },
            { f: 783.99, st: 1.80, d: 0.70 },
            { f: 1046.50, st: 2.55, d: 1.80 }
          ];
          notes.forEach(n => {
            const osc = c.createOscillator();
            const g = c.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(n.f, t + n.st);
            g.gain.setValueAtTime(0.22, t + n.st);
            g.gain.exponentialRampToValueAtTime(0.001, t + n.st + n.d);
            osc.connect(g);
            g.connect(c.destination);
            osc.start(t + n.st);
            osc.stop(t + n.st + n.d);
          });
        } catch (e) {}
      }
    }

    const audio = new V5AudioEngine();

    /**
     * MOTOR DA ARENA DE CORDA (CANVAS 2D - 60 FPS)
     */
    const canvas = document.getElementById('arena-canvas');
    const ctx = canvas.getContext('2d');
    let W = 0, H = 0;

    function resize() {
      const stage = document.getElementById('game-stage');
      W = stage.clientWidth;
      H = stage.clientHeight;
      canvas.width = W;
      canvas.height = H;
    }
    window.addEventListener('resize', resize);

    // Estado da Disputa
    let ropePosition = 50; // 50% = centro exato (limites: 15% a 85%)
    let targetRopePos = 50;
    let scoreBlueWins = 0;
    let scoreOrangeWins = 0;
    let pullsBlue = 0;
    let pullsOrange = 0;
    let isGameOver = false;
    let roundTime = 45;
    let timerInterval = null;

    let particles = [];
    let confettis = [];

    // DOM Elements
    const scoreBlueEl = document.getElementById('score-blue');
    const scoreOrangeEl = document.getElementById('score-orange');
    const roundTimerEl = document.getElementById('round-timer');
    const victoryOverlay = document.getElementById('victory-overlay');
    const victoryTitle = document.getElementById('victory-title');
    const victoryDetail = document.getElementById('victory-detail');
    const victoryIcon = document.getElementById('victory-icon');
    const resetFill = document.getElementById('reset-fill');
    const toastContainer = document.getElementById('toast-container');
    const debugDrawer = document.getElementById('debug-drawer');

    function pull(team, weight = 1, user = '@espectador', giftName = null) {
      if (isGameOver) return;
      audio.getCtx();

      const force = weight * 1.4;

      if (team === 'A') {
        pullsBlue += weight;
        targetRopePos = Math.max(12, targetRopePos - force);
        scoreBlueEl.innerText = pullsBlue;
        spawnParticles(W * (ropePosition / 100), H * 0.52, '#38bdf8', 6);

        if (giftName) {
          audio.playSuperPull();
          spawnToast(`🎁 ${user} enviou ${giftName}! (+${weight * 10} Tração Azul!)`, '#38bdf8');
        } else {
          audio.playTug();
        }
      } else {
        pullsOrange += weight;
        targetRopePos = Math.min(88, targetRopePos + force);
        scoreOrangeEl.innerText = pullsOrange;
        spawnParticles(W * (ropePosition / 100), H * 0.52, '#fb923c', 6);

        if (giftName) {
          audio.playSuperPull();
          spawnToast(`🎁 ${user} enviou ${giftName}! (+${weight * 10} Tração Laranja!)`, '#fb923c');
        } else {
          audio.playTug();
        }
      }

      checkThresholdWin();
    }

    function checkThresholdWin() {
      if (targetRopePos <= 15) {
        endRound('A');
      } else if (targetRopePos >= 85) {
        endRound('B');
      }
    }

    function spawnToast(text, color = '#38bdf8') {
      while (toastContainer && toastContainer.children.length >= 4) { toastContainer.removeChild(toastContainer.firstElementChild); }
      const toast = document.createElement('div');
      toast.className = 'toast-item';
      toast.style.borderColor = color;
      toast.innerHTML = `<span style="color:${color}">${text}</span>`;
      toastContainer.appendChild(toast);
      setTimeout(() => {
        toast.style.opacity = '0';
        toast.style.transition = 'opacity 0.3s ease';
        setTimeout(() => toast.remove(), 300);
      }, 2500);
    }

    function spawnParticles(x, y, color, count = 8) {
      for (let i = 0; i < count; i++) {
        particles.push({
          x: x,
          y: y,
          vx: (Math.random() - 0.5) * 6,
          vy: (Math.random() - 0.5) * 6,
          radius: Math.random() * 3 + 1,
          color: color,
          alpha: 1
        });
      }
    }

    function spawnConfetti() {
      const colors = ['#38bdf8', '#fb923c', '#fbbf24', '#10b981', '#ffffff'];
      for (let i = 0; i < 70; i++) {
        confettis.push({
          x: Math.random() * W,
          y: Math.random() * H * 0.3,
          vx: (Math.random() - 0.5) * 4,
          vy: Math.random() * 4 + 2,
          size: Math.random() * 8 + 4,
          color: colors[Math.floor(Math.random() * colors.length)],
          rotation: Math.random() * 360,
          rotSpeed: (Math.random() - 0.5) * 10
        });
      }
    }

    function startTimer() {
      roundTime = 45;
      isGameOver = false;
      targetRopePos = 50;
      ropePosition = 50;
      pullsBlue = 0;
      pullsOrange = 0;
      scoreBlueEl.innerText = '0';
      scoreOrangeEl.innerText = '0';
      roundTimerEl.innerText = roundTime;
      victoryOverlay.classList.remove('active');
      resetFill.style.width = '0%';

      if (timerInterval) clearInterval(timerInterval);

      timerInterval = setInterval(() => {
        roundTime--;
        roundTimerEl.innerText = roundTime;

        if (roundTime <= 0) {
          clearInterval(timerInterval);
          if (ropePosition < 50) endRound('A');
          else if (ropePosition > 50) endRound('B');
          else endRound('DRAW');
        }
      }, 1000);
    }

    function endRound(winner) {
      if (isGameOver) return;
      isGameOver = true;
      if (timerInterval) clearInterval(timerInterval);

      audio.playEpicVictoryJingle();
      spawnConfetti();

      if (winner === 'A') {
        scoreBlueWins++;
        victoryTitle.innerText = 'TIME AZUL VENCEU!';
        victoryTitle.style.color = '#38bdf8';
        victoryIcon.innerText = '🔵';
        victoryDetail.innerText = `Vitórias: Azul ${scoreBlueWins} x ${scoreOrangeWins} Laranja`;
      } else if (winner === 'B') {
        scoreOrangeWins++;
        victoryTitle.innerText = 'TIME LARANJA VENCEU!';
        victoryTitle.style.color = '#fb923c';
        victoryIcon.innerText = '🟠';
        victoryDetail.innerText = `Vitórias: Laranja ${scoreOrangeWins} x ${scoreBlueWins} Azul`;
      } else {
        victoryTitle.innerText = 'EMPATE HISTÓRICO!';
        victoryTitle.style.color = '#fbbf24';
        victoryIcon.innerText = '🤝';
        victoryDetail.innerText = 'Nenhum dos lados cedeu a corda!';
      }

      victoryOverlay.classList.add('active');

      setTimeout(() => {
        resetFill.style.width = '100%';
      }, 50);

      // Auto-Reset em 5 Segundos
      setTimeout(() => {
        startTimer();
      }, 5000);
    }

    /**
     * RENDER LOOP (60 FPS)
     */
    let lastFpsTime = performance.now();
    let frameCount = 0;

    function gameLoop(now) {
      ctx.clearRect(0, 0, W, H);

      // Interpolação suave da corda
      ropePosition += (targetRopePos - ropePosition) * 0.12;

      const centerY = H * 0.52;
      const markerX = W * (ropePosition / 100);

      // 1. Linha Central da Arena
      ctx.beginPath();
      ctx.setLineDash([6, 6]);
      ctx.moveTo(W * 0.5, centerY - 140);
      ctx.lineTo(W * 0.5, centerY + 140);
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.15)';
      ctx.lineWidth = 2;
      ctx.stroke();
      ctx.setLineDash([]);

      // Zonas de Vitória
      ctx.fillStyle = 'rgba(56, 189, 248, 0.08)';
      ctx.fillRect(0, centerY - 120, W * 0.15, 240);
      ctx.fillStyle = 'rgba(251, 146, 60, 0.08)';
      ctx.fillRect(W * 0.85, centerY - 120, W * 0.15, 240);

      // 2. Desenhar a Corda
      ctx.beginPath();
      ctx.moveTo(W * 0.1, centerY);
      ctx.lineTo(W * 0.9, centerY);
      ctx.strokeStyle = '#e2e8f0';
      ctx.lineWidth = 14;
      ctx.lineCap = 'round';
      ctx.shadowColor = 'rgba(255, 255, 255, 0.3)';
      ctx.shadowBlur = 10;
      ctx.stroke();
      ctx.shadowBlur = 0;

      // Trança da corda
      ctx.beginPath();
      ctx.setLineDash([4, 8]);
      ctx.moveTo(W * 0.1, centerY);
      ctx.lineTo(W * 0.9, centerY);
      ctx.strokeStyle = '#94a3b8';
      ctx.lineWidth = 4;
      ctx.stroke();
      ctx.setLineDash([]);

      // 3. Marcador Central da Corda (Fita Vermelha com Brilho)
      ctx.beginPath();
      ctx.arc(markerX, centerY, 16, 0, Math.PI * 2);
      ctx.fillStyle = '#ef4444';
      ctx.shadowColor = '#ef4444';
      ctx.shadowBlur = 18;
      ctx.fill();
      ctx.shadowBlur = 0;

      ctx.beginPath();
      ctx.arc(markerX, centerY, 8, 0, Math.PI * 2);
      ctx.fillStyle = '#ffffff';
      ctx.fill();

      // Fita caindo
      ctx.beginPath();
      ctx.moveTo(markerX - 4, centerY);
      ctx.lineTo(markerX - 8, centerY + 45);
      ctx.lineTo(markerX + 8, centerY + 45);
      ctx.lineTo(markerX + 4, centerY);
      ctx.fillStyle = '#ef4444';
      ctx.fill();

      // 4. Desenhar Lutador Azul (Esquerda)
      const blueX = markerX - (W * 0.28);
      drawPuller(blueX, centerY, '#38bdf8', 'AZUL', false);

      // 5. Desenhar Lutador Laranja (Direita)
      const orangeX = markerX + (W * 0.28);
      drawPuller(orangeX, centerY, '#fb923c', 'LARANJA', true);

      // 6. Atualizar Partículas
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.alpha -= 0.04;
        if (p.alpha <= 0) particles.splice(i, 1);
        else {
          ctx.beginPath();
          ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
          ctx.fillStyle = p.color;
          ctx.globalAlpha = p.alpha;
          ctx.fill();
          ctx.globalAlpha = 1.0;
        }
      }

      // 7. Atualizar Confetes
      for (let i = confettis.length - 1; i >= 0; i--) {
        const cf = confettis[i];
        cf.x += cf.vx;
        cf.y += cf.vy;
        cf.rotation += cf.rotSpeed;
        ctx.save();
        ctx.translate(cf.x, cf.y);
        ctx.rotate((cf.rotation * Math.PI) / 180);
        ctx.fillStyle = cf.color;
        ctx.fillRect(-cf.size / 2, -cf.size / 2, cf.size, cf.size * 0.6);
        ctx.restore();
        if (cf.y > H) confettis.splice(i, 1);
      }

      // Telemetria 60 FPS para Test Lab
      frameCount++;
      if (now - lastFpsTime >= 1000) {
        const fps = Math.round((frameCount * 1000) / (now - lastFpsTime));
        if (window.parent && window.self !== window.top) {
          window.parent.postMessage({
            type: 'TELEMETRY_STATS',
            gameId: '01_cabo_de_guerra_neon',
            stats: { fps: Math.min(60, fps), frameTimeMs: 16.6, frameDrops: 0, isHealthy: true }
          }, '*');
        }
        frameCount = 0;
        lastFpsTime = now;
      }

      requestAnimationFrame(gameLoop);
    }

    function drawPuller(x, y, color, label, isFacingLeft) {
      ctx.save();
      ctx.translate(x, y);
      if (isFacingLeft) ctx.scale(-1, 1);

      // Sombra projetada
      ctx.beginPath();
      ctx.ellipse(0, 55, 28, 10, 0, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(0, 0, 0, 0.4)';
      ctx.fill();

      // Tronco inclinado em esforço de tração
      ctx.beginPath();
      ctx.moveTo(-10, 30);
      ctx.lineTo(-20, -10);
      ctx.lineTo(5, -15);
      ctx.lineTo(15, 30);
      ctx.closePath();
      ctx.fillStyle = color;
      ctx.shadowColor = color;
      ctx.shadowBlur = 14;
      ctx.fill();
      ctx.shadowBlur = 0;

      // Cabeça
      ctx.beginPath();
      ctx.arc(-15, -35, 16, 0, Math.PI * 2);
      ctx.fillStyle = '#ffffff';
      ctx.fill();

      // Faixa na cabeça
      ctx.fillStyle = color;
      ctx.fillRect(-31, -40, 32, 7);

      // Braços segurando a corda
      ctx.beginPath();
      ctx.moveTo(-10, -5);
      ctx.lineTo(25, 0);
      ctx.strokeStyle = color;
      ctx.lineWidth = 8;
      ctx.lineCap = 'round';
      ctx.stroke();

      ctx.restore();
    }

    /**
     * INTEGRAÇÃO DE EVENTOS
     */
    function handleEvent(data) {
      if (!data) return;
      const cmd = (data.comment || data.action || '').toString().toLowerCase();
      const team = data.team;
      const weight = data.weight || data.coins || 1;
      const user = data.user || '@espectador';
      const giftName = data.giftName || null;

      if (cmd === '1' || team === 'A' || cmd.includes('azul')) {
        pull('A', weight, user, giftName);
      } else if (cmd === '2' || team === 'B' || cmd.includes('laranja') || cmd.includes('vermelho')) {
        pull('B', weight, user, giftName);
      }
    }

    // BroadcastChannel
    try {
      const channel = new BroadcastChannel('v5_broadcaster_games');
      channel.onmessage = (e) => handleEvent(e.data);
      window.addEventListener('beforeunload', () => { try { channel.close(); } catch(e) {} });
    } catch (e) {}

    // Window events
    window.addEventListener('v5_event', (e) => handleEvent(e.detail));
    window.addEventListener('message', (e) => {
      if (e.data && (e.data.type || e.data.action || e.data.comment)) handleEvent(e.data);
    });

    // Motor Anti-Silêncio Orgânico
    const mockUsers = ['@lucas_gamer', '@mari_live', '@pedro_stream', '@ana_pro', '@bruno_tk', '@clara_v5'];
    setInterval(() => {
      if (isGameOver) return;
      // Balanceamento elástico automático
      let teamChoice = 'A';
      if (targetRopePos > 55) teamChoice = Math.random() < 0.65 ? 'A' : 'B';
      else if (targetRopePos < 45) teamChoice = Math.random() < 0.65 ? 'B' : 'A';
      else teamChoice = Math.random() < 0.5 ? 'A' : 'B';

      const user = mockUsers[Math.floor(Math.random() * mockUsers.length)];
      pull(teamChoice, 1, user);
    }, 2600);

    function toggleDebug() {
      debugDrawer.style.display = debugDrawer.style.display === 'flex' ? 'none' : 'flex';
    }

    window.addEventListener('keydown', (e) => {
      if (e.key === 'd' || e.key === 'D') toggleDebug();
    });

    // Inicialização
    resize();
    startTimer();
    requestAnimationFrame(gameLoop);
  </script>
</body>
</html>
