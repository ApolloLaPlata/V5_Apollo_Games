<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>V5 Live: Cabo de Guerra dos Elementos — Fogo vs Gelo (9:16)</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      background-color: #020617;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      width: 100vw;
      height: 100vh;
    }

    #game-stage {
      position: relative;
      width: 100vw;
      height: 100vh;
      max-width: calc(100vh * (9 / 16));
      background: radial-gradient(circle at 50% 30%, #0b1329 0%, #020617 100%);
      border: 1px solid rgba(255, 255, 255, 0.08);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      overflow: hidden;
      box-shadow: 0 0 50px rgba(0, 0, 0, 0.9);
    }

    /* Top Safe Zone (140px) */
    .top-header {
      padding: 18px 16px 8px 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      z-index: 10;
      background: linear-gradient(180deg, rgba(2, 6, 23, 0.95) 0%, rgba(2, 6, 23, 0) 100%);
    }

    .brand-row {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .brand-tag {
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: #94a3b8;
      font-family: monospace;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .live-dot {
      width: 8px;
      height: 8px;
      background: #ef4444;
      border-radius: 50%;
      box-shadow: 0 0 10px #ef4444;
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.85); }
    }

    .timer-badge {
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid rgba(239, 68, 68, 0.4);
      color: #fca5a5;
      font-size: 13px;
      font-weight: 800;
      padding: 4px 12px;
      border-radius: 20px;
      font-variant-numeric: tabular-nums;
      display: flex;
      align-items: center;
      gap: 5px;
    }

    /* Placar Termomégico Elemental */
    .score-board {
      width: 100%;
      display: grid;
      grid-template-columns: 1fr 1.2fr 1fr;
      gap: 8px;
      align-items: center;
      background: rgba(15, 23, 42, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 16px;
      padding: 10px 14px;
      backdrop-filter: blur(10px);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
    }

    .team-box {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .team-ice {
      color: #38bdf8;
      text-shadow: 0 0 14px rgba(56, 189, 248, 0.7);
    }

    .team-fire {
      color: #f87171;
      text-shadow: 0 0 14px rgba(248, 113, 113, 0.7);
    }

    .temp-box {
      border-left: 1px solid rgba(255, 255, 255, 0.1);
      border-right: 1px solid rgba(255, 255, 255, 0.1);
      padding: 0 6px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .temp-val {
      font-size: 16px;
      font-weight: 900;
      font-family: monospace;
      color: #fbbf24;
      text-shadow: 0 0 10px rgba(251, 191, 36, 0.5);
    }

    .box-title {
      font-size: 10px;
      text-transform: uppercase;
      font-weight: 800;
      letter-spacing: 1px;
      opacity: 0.85;
    }

    .box-score {
      font-size: 20px;
      font-weight: 900;
      font-family: monospace;
      margin-top: 2px;
    }

    /* Arena Central Canvas */
    #arena-container {
      position: absolute;
      inset: 0;
      z-index: 1;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    /* Bottom Safe Zone (180px) */
    .bottom-panel {
      padding: 12px 16px 20px 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      z-index: 10;
      background: linear-gradient(0deg, rgba(2, 6, 23, 0.98) 0%, rgba(2, 6, 23, 0.7) 70%, rgba(2, 6, 23, 0) 100%);
      pointer-events: none;
    }

    .chat-instructions {
      display: flex;
      justify-content: space-between;
      gap: 8px;
    }

    .cmd-pill {
      flex: 1;
      background: rgba(30, 41, 59, 0.8);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 12px;
      padding: 10px 8px;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
    }

    .cmd-pill.ice {
      border-color: rgba(56, 189, 248, 0.5);
      background: rgba(56, 189, 248, 0.12);
    }

    .cmd-pill.fire {
      border-color: rgba(248, 113, 113, 0.5);
      background: rgba(248, 113, 113, 0.12);
    }

    .cmd-key {
      font-size: 16px;
      font-weight: 900;
      font-family: monospace;
    }

    .cmd-desc {
      font-size: 10px;
      color: #cbd5e1;
      font-weight: 700;
      text-transform: uppercase;
    }

    .gift-cta {
      background: linear-gradient(90deg, rgba(234, 88, 12, 0.25) 0%, rgba(56, 189, 248, 0.25) 100%);
      border: 1px solid rgba(251, 191, 36, 0.4);
      border-radius: 12px;
      padding: 8px 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 0 15px rgba(251, 191, 36, 0.2);
    }

    .toast-container {
      position: absolute;
      top: 145px;
      width: calc(100% - 32px);
      left: 16px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      pointer-events: none;
      z-index: 20;
    }

    .toast-item {
      background: rgba(15, 23, 42, 0.92);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 10px;
      padding: 8px 12px;
      font-size: 12px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: space-between;
      backdrop-filter: blur(8px);
      animation: slideDown 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
    }

    @keyframes slideDown {
      from { opacity: 0; transform: translateY(-15px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Overlay Vitória */
    #victory-overlay {
      position: absolute;
      inset: 0;
      background: rgba(2, 6, 23, 0.92);
      backdrop-filter: blur(12px);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 24px;
      z-index: 100;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.4s ease;
    }

    #victory-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .victory-box {
      background: rgba(15, 23, 42, 0.95);
      border: 2px solid #fbbf24;
      border-radius: 24px;
      padding: 32px 24px;
      width: 100%;
      max-width: 380px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      box-shadow: 0 0 50px rgba(251, 191, 36, 0.35);
      animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
    }

    @keyframes popIn {
      0% { transform: scale(0.7); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }

    .reset-progress-bar {
      width: 100%;
      height: 8px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 4px;
      overflow: hidden;
      margin-top: 15px;
    }

    .reset-progress-fill {
      height: 100%;
      background: #fbbf24;
      width: 0%;
      transition: width 5s linear;
    }

    /* Gaveta de Debug */
    #debug-drawer {
      position: absolute;
      bottom: 12px;
      left: 12px;
      right: 12px;
      background: rgba(15, 23, 42, 0.95);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 14px;
      padding: 10px;
      display: none;
      flex-direction: column;
      gap: 6px;
      z-index: 200;
      pointer-events: auto;
    }

    .debug-buttons {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 5px;
    }

    .debug-btn {
      background: #1e293b;
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #f1f5f9;
      font-size: 10px;
      font-weight: 700;
      padding: 7px 4px;
      border-radius: 8px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div id="game-stage">
    
    <!-- Top Safe Zone -->
    <header class="top-header">
      <div class="brand-row">
        <div class="brand-tag">
          <span class="live-dot"></span>
          V5 LIVE ELEMENTOS
        </div>
        <div class="timer-badge">
          ⏳ <span id="round-timer">45</span>s
        </div>
      </div>

      <div class="score-board">
        <div class="team-box team-ice">
          <span class="box-title">❄️ Gelo</span>
          <span class="box-score" id="score-ice">0</span>
        </div>
        <div class="temp-box">
          <span class="box-title">Termômetro</span>
          <span class="temp-val" id="temp-indicator">0°C</span>
        </div>
        <div class="team-box team-fire">
          <span class="box-title">🔥 Fogo</span>
          <span class="box-score" id="score-fire">0</span>
        </div>
      </div>
    </header>

    <!-- Canvas Central -->
    <div id="arena-container">
      <canvas id="elemental-canvas"></canvas>
    </div>

    <!-- Feed de Presentes -->
    <div class="toast-container" id="toast-container"></div>

    <!-- Bottom Safe Zone -->
    <footer class="bottom-panel">
      <div class="chat-instructions">
        <div class="cmd-pill ice">
          <span class="cmd-key team-ice">1</span>
          <span class="cmd-desc">❄️ Nevasca (Gelo)</span>
        </div>
        <div class="cmd-pill fire">
          <span class="cmd-key team-fire">2</span>
          <span class="cmd-desc">🔥 Magma (Fogo)</span>
        </div>
      </div>

      <div class="gift-cta">
        <span style="font-size: 11px; font-weight: 700; color: #fef08a;">🎁 Presentes = Nevasca Ártica & Erupção Vulcânica!</span>
        <span style="background: #f59e0b; color: #000; font-weight: 900; font-size: 10px; padding: 3px 8px; border-radius: 8px;">50x FORÇA</span>
      </div>
    </footer>

    <!-- Overlay Vitória -->
    <div id="victory-overlay">
      <div class="victory-box">
        <div style="font-size: 52px; margin-bottom: 10px;" id="victory-icon">❄️</div>
        <h2 id="victory-title" style="font-size: 26px; font-weight: 900; text-transform: uppercase;">ERA DO GELO VENCEU!</h2>
        <p id="victory-detail" style="font-size: 14px; color: #94a3b8; margin: 8px 0 16px 0;">Temperatura final atingida</p>
        <p style="font-size: 12px; color: #cbd5e1; font-weight: 600;">Reiniciando próximo confronto...</p>
        <div class="reset-progress-bar">
          <div class="reset-progress-fill" id="reset-fill"></div>
        </div>
      </div>
    </div>

    <!-- Painel Debug -->
    <div id="debug-drawer">
      <div style="font-size: 11px; font-weight: 800; color: #94a3b8; display: flex; justify-content: space-between;">
        <span>🎮 Testes Elementais [D]</span>
        <span style="cursor:pointer;" onclick="toggleDebug()">✕ Fechar</span>
      </div>
      <div class="debug-buttons">
        <button class="debug-btn" onclick="castElemental('A', 1, '@teste_gelo')">❄️ Voto Gelo (1)</button>
        <button class="debug-btn" onclick="castElemental('B', 1, '@teste_fogo')">🔥 Voto Fogo (2)</button>
        <button class="debug-btn" onclick="castElemental('A', 15, '@vip_blizzard', 'Rosa')">🌸 Nevasca (+15)</button>
        <button class="debug-btn" onclick="castElemental('B', 50, '@vip_vulcao', 'Leão')">🦁 Erupção (+50)</button>
        <button class="debug-btn" onclick="endRound('A')">🏆 Fim Gelo</button>
        <button class="debug-btn" onclick="endRound('B')">🏆 Fim Fogo</button>
      </div>
    </div>

  </div>

  <script>
    /**
     * SINTETIZADOR ELEMENTAL PROCEDURAL (Web Audio API)
     */
    class ElementalAudio {
      constructor() {
        this.ctx = null;
      }
      getCtx() {
        if (!this.ctx) {
          const AudioContextClass = window.AudioContext || window.webkitAudioContext;
          this.ctx = new AudioContextClass();
        }
        if (this.ctx.state === 'suspended') this.ctx.resume();
        return this.ctx;
      }
      // Estalido agudo de gelo trincando
      playIceCrack() {
        try {
          const c = this.getCtx();
          const t = c.currentTime;
          const osc = c.createOscillator();
          const g = c.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(1400, t);
          osc.frequency.exponentialRampToValueAtTime(2600, t + 0.08);
          g.gain.setValueAtTime(0.2, t);
          g.gain.exponentialRampToValueAtTime(0.001, t + 0.14);
          osc.connect(g);
          g.connect(c.destination);
          osc.start(t);
          osc.stop(t + 0.14);
        } catch (e) {}
      }
      // Labareda crepitante de fogo
      playFireWhoosh() {
        try {
          const c = this.getCtx();
          const t = c.currentTime;
          const osc = c.createOscillator();
          const g = c.createGain();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(180, t);
          osc.frequency.exponentialRampToValueAtTime(60, t + 0.18);
          g.gain.setValueAtTime(0.25, t);
          g.gain.exponentialRampToValueAtTime(0.001, t + 0.18);
          osc.connect(g);
          g.connect(c.destination);
          osc.start(t);
          osc.stop(t + 0.18);
        } catch (e) {}
      }
      // Super Erupção / Nevasca
      playElementalSurge() {
        try {
          const c = this.getCtx();
          const t = c.currentTime;
          const osc = c.createOscillator();
          const g = c.createGain();
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(320, t);
          osc.frequency.exponentialRampToValueAtTime(40, t + 0.45);
          g.gain.setValueAtTime(0.35, t);
          g.gain.exponentialRampToValueAtTime(0.001, t + 0.45);
          osc.connect(g);
          g.connect(c.destination);
          osc.start(t);
          osc.stop(t + 0.45);
        } catch (e) {}
      }
      playVictory() {
        try {
          const c = this.getCtx();
          const t = c.currentTime;
          [523.25, 659.25, 783.99, 1046.50].forEach((f, i) => {
            const osc = c.createOscillator();
            const g = c.createGain();
            const st = t + (i * 0.12);
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(f, st);
            g.gain.setValueAtTime(0.2, st);
            g.gain.exponentialRampToValueAtTime(0.001, st + 0.4);
            osc.connect(g);
            g.connect(c.destination);
            osc.start(st);
            osc.stop(st + 0.4);
          });
        } catch (e) {}
      }
    }

    const audio = new ElementalAudio();

    /**
     * MOTOR FÍSICO DO CABO ELEMENTAL (CANVAS 2D - 60 FPS)
     */
    const canvas = document.getElementById('elemental-canvas');
    const ctx = canvas.getContext('2d');
    let W = 0, H = 0;

    function resize() {
      const stage = document.getElementById('game-stage');
      W = stage.clientWidth;
      H = stage.clientHeight;
      canvas.width = W;
      canvas.height = H;
    }
    window.addEventListener('resize', resize);

    // Estado da Partida
    let orbPos = 50.0; // 50% = centro (0% gelo total, 100% fogo total)
    let targetPos = 50.0;
    let scoreIce = 0;
    let scoreFire = 0;
    let winsIce = 0;
    let winsFire = 0;
    let roundTime = 45;
    let timerInterval = null;
    let isGameOver = false;

    let fireParticles = [];
    let iceParticles = [];
    let steamParticles = [];
    let confettis = [];

    // DOM Elements
    const scoreIceEl = document.getElementById('score-ice');
    const scoreFireEl = document.getElementById('score-fire');
    const tempIndicatorEl = document.getElementById('temp-indicator');
    const roundTimerEl = document.getElementById('round-timer');
    const victoryOverlay = document.getElementById('victory-overlay');
    const victoryTitle = document.getElementById('victory-title');
    const victoryDetail = document.getElementById('victory-detail');
    const victoryIcon = document.getElementById('victory-icon');
    const resetFill = document.getElementById('reset-fill');
    const toastContainer = document.getElementById('toast-container');
    const debugDrawer = document.getElementById('debug-drawer');

    function castElemental(team, weight = 1, user = '@espectador', giftName = null) {
      if (isGameOver) return;
      audio.getCtx();

      const force = weight * 1.5;

      if (team === 'A') { // GELO
        scoreIce += weight;
        targetPos = Math.max(12, targetPos - force);
        scoreIceEl.innerText = scoreIce;
        spawnIceParticles(W * (orbPos / 100), H * 0.52, 10);

        if (giftName) {
          audio.playElementalSurge();
          spawnToast(`❄️ ${user} lançou ${giftName}! NEVASCA ÁRTICA (+${weight * 10})`, '#38bdf8');
        } else {
          audio.playIceCrack();
        }
      } else { // FOGO
        scoreFire += weight;
        targetPos = Math.min(88, targetPos + force);
        scoreFireEl.innerText = scoreFire;
        spawnFireParticles(W * (orbPos / 100), H * 0.52, 10);

        if (giftName) {
          audio.playElementalSurge();
          spawnToast(`🔥 ${user} lançou ${giftName}! ERUPÇÃO DE MAGMA (+${weight * 10})`, '#f87171');
        } else {
          audio.playFireWhoosh();
        }
      }

      // Vapor na colisão
      spawnSteam(W * (orbPos / 100), H * 0.52, 5);

      if (targetPos <= 15) endRound('A');
      else if (targetPos >= 85) endRound('B');
    }

    function spawnToast(text, color = '#38bdf8') {
      const toast = document.createElement('div');
      toast.className = 'toast-item';
      toast.style.borderColor = color;
      toast.innerHTML = `<span style="color:${color}">${text}</span>`;
      toastContainer.appendChild(toast);
      setTimeout(() => {
        toast.style.opacity = '0';
        toast.style.transition = 'opacity 0.3s ease';
        setTimeout(() => toast.remove(), 300);
      }, 2500);
    }

    function spawnFireParticles(x, y, count = 8) {
      for (let i = 0; i < count; i++) {
        fireParticles.push({
          x: x + (Math.random() - 0.5) * 20,
          y: y + (Math.random() - 0.5) * 20,
          vx: Math.random() * 4 + 1,
          vy: (Math.random() - 0.7) * 4,
          radius: Math.random() * 4 + 2,
          color: Math.random() < 0.5 ? '#f87171' : '#fb923c',
          alpha: 1.0
        });
      }
    }

    function spawnIceParticles(x, y, count = 8) {
      for (let i = 0; i < count; i++) {
        iceParticles.push({
          x: x + (Math.random() - 0.5) * 20,
          y: y + (Math.random() - 0.5) * 20,
          vx: -(Math.random() * 4 + 1),
          vy: (Math.random() - 0.5) * 3,
          size: Math.random() * 6 + 2,
          color: Math.random() < 0.5 ? '#38bdf8' : '#e0f2fe',
          alpha: 1.0,
          rot: Math.random() * 360
        });
      }
    }

    function spawnSteam(x, y, count = 6) {
      for (let i = 0; i < count; i++) {
        steamParticles.push({
          x: x + (Math.random() - 0.5) * 15,
          y: y + (Math.random() - 0.5) * 15,
          vx: (Math.random() - 0.5) * 2,
          vy: -Math.random() * 3 - 1,
          radius: Math.random() * 6 + 4,
          alpha: 0.6
        });
      }
    }

    function spawnConfetti(isIce) {
      const colors = isIce ? ['#38bdf8', '#7dd3fc', '#bae6fd', '#ffffff'] : ['#f87171', '#fb923c', '#fbbf24', '#ffffff'];
      for (let i = 0; i < 70; i++) {
        confettis.push({
          x: Math.random() * W,
          y: Math.random() * H * 0.3,
          vx: (Math.random() - 0.5) * 4,
          vy: Math.random() * 4 + 2,
          size: Math.random() * 8 + 4,
          color: colors[Math.floor(Math.random() * colors.length)],
          rotation: Math.random() * 360,
          rotSpeed: (Math.random() - 0.5) * 10
        });
      }
    }

    function startTimer() {
      roundTime = 45;
      isGameOver = false;
      orbPos = 50;
      targetPos = 50;
      scoreIce = 0;
      scoreFire = 0;
      scoreIceEl.innerText = '0';
      scoreFireEl.innerText = '0';
      roundTimerEl.innerText = roundTime;
      victoryOverlay.classList.remove('active');
      resetFill.style.width = '0%';

      if (timerInterval) clearInterval(timerInterval);

      timerInterval = setInterval(() => {
        roundTime--;
        roundTimerEl.innerText = roundTime;

        if (roundTime <= 0) {
          clearInterval(timerInterval);
          if (orbPos < 50) endRound('A');
          else if (orbPos > 50) endRound('B');
          else endRound('DRAW');
        }
      }, 1000);
    }

    function endRound(winner) {
      if (isGameOver) return;
      isGameOver = true;
      if (timerInterval) clearInterval(timerInterval);

      audio.playVictory();
      const isIce = winner === 'A';
      spawnConfetti(isIce);

      if (winner === 'A') {
        winsIce++;
        victoryTitle.innerText = 'ERA DO GELO VENCEU!';
        victoryTitle.style.color = '#38bdf8';
        victoryIcon.innerText = '❄️';
        victoryDetail.innerText = `Congelamento Total! Vitórias: Gelo ${winsIce} x ${winsFire} Fogo`;
      } else if (winner === 'B') {
        winsFire++;
        victoryTitle.innerText = 'CHAMAS ETERNAS VENCERAM!';
        victoryTitle.style.color = '#f87171';
        victoryIcon.innerText = '🔥';
        victoryDetail.innerText = `Incineração Total! Vitórias: Fogo ${winsFire} x ${winsIce} Gelo`;
      } else {
        victoryTitle.innerText = 'EQUILÍBRIO ELEMENTAL!';
        victoryTitle.style.color = '#fbbf24';
        victoryIcon.innerText = '⚖️';
        victoryDetail.innerText = 'Gelo e Fogo empataram em força!';
      }

      victoryOverlay.classList.add('active');

      setTimeout(() => {
        resetFill.style.width = '100%';
      }, 50);

      setTimeout(() => {
        startTimer();
      }, 5000);
    }

    /**
     * RENDER LOOP (60 FPS)
     */
    let lastFpsTime = performance.now();
    let frameCount = 0;

    function gameLoop(now) {
      ctx.clearRect(0, 0, W, H);

      // Suavização do Orbe
      orbPos += (targetPos - orbPos) * 0.12;

      // Cálculo de Temperatura Dinâmica (-100°C a +1000°C)
      const temp = Math.round(((orbPos - 50) / 50) * (orbPos >= 50 ? 1000 : 100));
      tempIndicatorEl.innerText = `${temp}°C`;
      tempIndicatorEl.style.color = temp < 0 ? '#38bdf8' : (temp > 0 ? '#f87171' : '#fbbf24');

      const centerY = H * 0.52;
      const orbX = W * (orbPos / 100);

      // 1. Feixe de Gelo (Esquerda)
      const gradIce = ctx.createLinearGradient(W * 0.1, centerY, orbX, centerY);
      gradIce.addColorStop(0, '#0284c7');
      gradIce.addColorStop(1, '#38bdf8');
      ctx.beginPath();
      ctx.moveTo(W * 0.1, centerY);
      ctx.lineTo(orbX, centerY);
      ctx.strokeStyle = gradIce;
      ctx.lineWidth = 14;
      ctx.shadowColor = '#38bdf8';
      ctx.shadowBlur = 18;
      ctx.stroke();
      ctx.shadowBlur = 0;

      // 2. Feixe de Fogo (Direita)
      const gradFire = ctx.createLinearGradient(orbX, centerY, W * 0.9, centerY);
      gradFire.addColorStop(0, '#f87171');
      gradFire.addColorStop(1, '#ea580c');
      ctx.beginPath();
      ctx.moveTo(orbX, centerY);
      ctx.lineTo(W * 0.9, centerY);
      ctx.strokeStyle = gradFire;
      ctx.lineWidth = 14;
      ctx.shadowColor = '#f87171';
      ctx.shadowBlur = 18;
      ctx.stroke();
      ctx.shadowBlur = 0;

      // 3. Orbe Central Elemental
      ctx.beginPath();
      ctx.arc(orbX, centerY, 24, 0, Math.PI * 2);
      ctx.fillStyle = orbPos < 50 ? '#38bdf8' : '#f87171';
      ctx.shadowColor = orbPos < 50 ? '#38bdf8' : '#f87171';
      ctx.shadowBlur = 25;
      ctx.fill();
      ctx.shadowBlur = 0;

      ctx.beginPath();
      ctx.arc(orbX, centerY, 12, 0, Math.PI * 2);
      ctx.fillStyle = '#ffffff';
      ctx.fill();

      // Ícone do Orbe
      ctx.fillStyle = '#0f172a';
      ctx.font = '14px sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(orbPos < 50 ? '❄️' : '🔥', orbX, centerY);

      // 4. Partículas de Fogo
      for (let i = fireParticles.length - 1; i >= 0; i--) {
        const p = fireParticles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.alpha -= 0.035;
        if (p.alpha <= 0) fireParticles.splice(i, 1);
        else {
          ctx.beginPath();
          ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
          ctx.fillStyle = p.color;
          ctx.globalAlpha = p.alpha;
          ctx.shadowColor = p.color;
          ctx.shadowBlur = 8;
          ctx.fill();
          ctx.shadowBlur = 0;
          ctx.globalAlpha = 1.0;
        }
      }

      // 5. Partículas de Gelo
      for (let i = iceParticles.length - 1; i >= 0; i--) {
        const p = iceParticles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.alpha -= 0.03;
        if (p.alpha <= 0) iceParticles.splice(i, 1);
        else {
          ctx.save();
          ctx.translate(p.x, p.y);
          ctx.rotate((p.rot * Math.PI) / 180);
          ctx.fillStyle = p.color;
          ctx.globalAlpha = p.alpha;
          ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size);
          ctx.restore();
          ctx.globalAlpha = 1.0;
        }
      }

      // 6. Vapor Térmico
      for (let i = steamParticles.length - 1; i >= 0; i--) {
        const s = steamParticles[i];
        s.x += s.vx;
        s.y += s.vy;
        s.radius += 0.2;
        s.alpha -= 0.02;
        if (s.alpha <= 0) steamParticles.splice(i, 1);
        else {
          ctx.beginPath();
          ctx.arc(s.x, s.y, s.radius, 0, Math.PI * 2);
          ctx.fillStyle = 'rgba(255, 255, 255, ' + s.alpha + ')';
          ctx.fill();
        }
      }

      // 7. Confetes
      for (let i = confettis.length - 1; i >= 0; i--) {
        const cf = confettis[i];
        cf.x += cf.vx;
        cf.y += cf.vy;
        cf.rotation += cf.rotSpeed;
        ctx.save();
        ctx.translate(cf.x, cf.y);
        ctx.rotate((cf.rotation * Math.PI) / 180);
        ctx.fillStyle = cf.color;
        ctx.fillRect(-cf.size / 2, -cf.size / 2, cf.size, cf.size * 0.6);
        ctx.restore();
        if (cf.y > H) confettis.splice(i, 1);
      }

      // Telemetria 60 FPS
      frameCount++;
      if (now - lastFpsTime >= 1000) {
        const fps = Math.round((frameCount * 1000) / (now - lastFpsTime));
        if (window.parent && window.self !== window.top) {
          window.parent.postMessage({
            type: 'TELEMETRY_STATS',
            gameId: '01b_cabo_de_guerra_elementos',
            stats: { fps: Math.min(60, fps), frameTimeMs: 16.6, frameDrops: 0, isHealthy: true }
          }, '*');
        }
        frameCount = 0;
        lastFpsTime = now;
      }

      requestAnimationFrame(gameLoop);
    }

    /**
     * INTEGRAÇÃO DE EVENTOS
     */
    function handleEvent(data) {
      if (!data) return;
      const cmd = (data.comment || data.action || '').toString().toLowerCase();
      const team = data.team;
      const weight = data.weight || data.coins || 1;
      const user = data.user || '@espectador';
      const giftName = data.giftName || null;

      if (cmd === '1' || team === 'A' || cmd.includes('gelo') || cmd.includes('ice') || cmd.includes('azul')) {
        castElemental('A', weight, user, giftName);
      } else if (cmd === '2' || team === 'B' || cmd.includes('fogo') || cmd.includes('fire') || cmd.includes('vermelho')) {
        castElemental('B', weight, user, giftName);
      }
    }

    try {
      const channel = new BroadcastChannel('v5_broadcaster_games');
      channel.onmessage = (e) => handleEvent(e.data);
    } catch (e) {}

    window.addEventListener('v5_event', (e) => handleEvent(e.detail));
    window.addEventListener('message', (e) => {
      if (e.data && (e.data.type || e.data.action || e.data.comment)) handleEvent(e.data);
    });

    // Motor Anti-Silêncio Orgânico
    const mockUsers = ['@carlos_frost', '@mari_flame', '@pedro_ice', '@ana_fire', '@lucas_blizzard', '@julia_magma'];
    setInterval(() => {
      if (isGameOver) return;
      let teamChoice = 'A';
      if (targetPos > 55) teamChoice = Math.random() < 0.65 ? 'A' : 'B';
      else if (targetPos < 45) teamChoice = Math.random() < 0.65 ? 'B' : 'A';
      else teamChoice = Math.random() < 0.5 ? 'A' : 'B';

      const user = mockUsers[Math.floor(Math.random() * mockUsers.length)];
      castElemental(teamChoice, 1, user);
    }, 2500);

    function toggleDebug() {
      debugDrawer.style.display = debugDrawer.style.display === 'flex' ? 'none' : 'flex';
    }

    window.addEventListener('keydown', (e) => {
      if (e.key === 'd' || e.key === 'D') toggleDebug();
    });

    resize();
    startTimer();
    requestAnimationFrame(gameLoop);
  </script>
</body>
</html>
