<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>V5 Live: Subida da Montanha Sagrada (9:16)</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      background-color: #030712;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      width: 100vw;
      height: 100vh;
    }

    /* Container 9:16 Estrito Responsivo para OBS Browser Source */
    #game-stage {
      position: relative;
      width: 100vw;
      height: 100vh;
      max-width: calc(100vh * (9 / 16));
      background: radial-gradient(circle at 50% 20%, #1e1138 0%, #0a0618 60%, #030208 100%);
      border: 1px solid rgba(255, 255, 255, 0.08);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      overflow: hidden;
      box-shadow: 0 0 50px rgba(0, 0, 0, 0.95);
      transition: transform 0.05s ease-out;
    }

    /* Top Safe Zone (140px) */
    .top-header {
      padding: 14px 16px 8px 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      z-index: 10;
      background: linear-gradient(180deg, rgba(10, 6, 24, 0.98) 0%, rgba(10, 6, 24, 0) 100%);
    }

    .brand-row {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .brand-tag {
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: #facc15;
      font-family: monospace;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .live-dot {
      width: 8px;
      height: 8px;
      background: #ef4444;
      border-radius: 50%;
      box-shadow: 0 0 10px #ef4444;
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.85); }
    }

    .timer-badge {
      background: rgba(250, 204, 21, 0.15);
      border: 1px solid rgba(250, 204, 21, 0.6);
      color: #fde047;
      font-size: 12px;
      font-weight: 900;
      padding: 4px 12px;
      border-radius: 20px;
      font-variant-numeric: tabular-nums;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    /* Placar de Altitude (0m a 1000m) */
    .alt-hud {
      width: 100%;
      background: rgba(20, 12, 44, 0.85);
      border: 1px solid rgba(250, 204, 21, 0.4);
      border-radius: 12px;
      padding: 8px 12px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      backdrop-filter: blur(8px);
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.6);
    }

    .alt-status-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .alt-title {
      font-size: 12px;
      font-weight: 900;
      letter-spacing: 1px;
      color: #fef08a;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .alt-meter {
      font-family: monospace;
      font-size: 13px;
      font-weight: 900;
      color: #facc15;
    }

    .alt-bar-bg {
      position: relative;
      width: 100%;
      height: 14px;
      background: #020617;
      border-radius: 7px;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.15);
    }

    .alt-bar-fill {
      position: absolute;
      top: 0;
      left: 0;
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #ca8a04 0%, #facc15 50%, #38bdf8 100%);
      box-shadow: 0 0 12px rgba(250, 204, 21, 0.7);
      transition: width 0.15s ease-out;
    }

    .shield-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 10px;
      font-weight: 800;
      color: #94a3b8;
    }

    .shield-icons {
      display: flex;
      gap: 4px;
    }

    .shield-pip {
      color: #38bdf8;
      font-size: 11px;
    }

    .shield-lost {
      color: #475569;
    }

    /* Canvas da Montanha */
    #mountain-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      pointer-events: none;
    }

    /* Bottom Safe Zone (180px) */
    .bottom-panel {
      padding: 10px 14px 16px 14px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      z-index: 10;
      background: linear-gradient(0deg, rgba(10, 6, 24, 0.98) 0%, rgba(10, 6, 24, 0) 100%);
    }

    /* Grade de Comandos de Escalada */
    .climb-controls-grid {
      display: flex;
      gap: 8px;
      justify-content: space-between;
      width: 100%;
    }

    .climb-card {
      flex: 1;
      background: rgba(24, 14, 52, 0.85);
      border: 2px solid rgba(250, 204, 21, 0.3);
      border-radius: 10px;
      padding: 6px 8px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      transition: transform 0.1s ease, border-color 0.2s ease;
      cursor: pointer;
    }

    .climb-card-active {
      transform: scale(1.06);
      border-color: #38bdf8 !important;
      box-shadow: 0 0 15px rgba(56, 189, 248, 0.6);
    }

    .climb-key {
      background: #7c3aed;
      color: #ffffff;
      font-size: 13px;
      font-weight: 900;
      width: 26px;
      height: 26px;
      border-radius: 8px;
      display: flex;
      justify-content: center;
      align-items: center;
      box-shadow: 0 0 8px rgba(124, 58, 237, 0.6);
    }

    .climb-label {
      font-size: 11px;
      font-weight: 800;
      color: #fef08a;
      text-transform: uppercase;
    }

    .climb-sub {
      font-size: 9px;
      font-weight: 700;
      color: #a855f7;
      font-family: monospace;
    }

    /* Leaderboard MVP */
    .mvp-bar {
      width: 100%;
      background: rgba(20, 12, 44, 0.8);
      border: 1px solid rgba(250, 204, 21, 0.3);
      border-radius: 8px;
      padding: 5px 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 11px;
    }

    .mvp-label {
      font-weight: 800;
      color: #facc15;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .mvp-user {
      font-weight: 700;
      color: #ffffff;
    }

    .mvp-score {
      font-family: monospace;
      font-weight: 900;
      color: #38bdf8;
    }

    /* Gaveta de Depuração Local */
    .debug-drawer {
      display: flex;
      gap: 6px;
      justify-content: center;
    }

    .debug-btn {
      background: #1e1138;
      border: 1px solid rgba(250, 204, 21, 0.3);
      color: #fef08a;
      padding: 5px 9px;
      border-radius: 6px;
      font-size: 10px;
      font-weight: 700;
      cursor: pointer;
    }

    .debug-btn:hover { background: #4c1d95; }

    /* Overlay de Fim de Partida */
    #summit-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(3, 1, 10, 0.94);
      backdrop-filter: blur(12px);
      z-index: 50;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 16px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.4s ease-out;
    }

    #summit-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .overlay-badge {
      font-size: 48px;
      animation: bounce 0.8s infinite alternate ease-in-out;
    }

    @keyframes bounce {
      0% { transform: scale(1); }
      100% { transform: scale(1.15); }
    }

    .overlay-title {
      font-size: 26px;
      font-weight: 900;
      letter-spacing: 2px;
      text-transform: uppercase;
      text-align: center;
      background: linear-gradient(135deg, #facc15 0%, #f43f5e 50%, #38bdf8 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .defeat-title {
      background: linear-gradient(135deg, #ef4444 0%, #7f1d1d 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .podium-box {
      width: 85%;
      max-width: 320px;
      background: rgba(24, 14, 52, 0.9);
      border: 1px solid rgba(250, 204, 21, 0.4);
      border-radius: 12px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .podium-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 6px 10px;
      background: rgba(10, 6, 24, 0.6);
      border-radius: 6px;
      font-size: 11px;
    }

    .auto-reset-bar {
      width: 85%;
      max-width: 320px;
      height: 6px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 3px;
      overflow: hidden;
    }

    .auto-reset-fill {
      height: 100%;
      width: 100%;
      background: #facc15;
    }
  </style>
</head>
<body>
  <div id="game-stage">
    <!-- Top Safe Zone (140px) -->
    <header class="top-header">
      <div class="brand-row">
        <div class="brand-tag">
          <div class="live-dot"></div>
          V5 MONTANHA SAGRADA
        </div>
        <div class="timer-badge" id="timer-badge">
          ⏳ <span id="timer-val">45.0s</span>
        </div>
      </div>

      <!-- Placar de Altitude -->
      <div class="alt-hud">
        <div class="alt-status-row">
          <div class="alt-title">
            🏔️ RUMO AO CUME SAGRADO
          </div>
          <div class="alt-meter" id="alt-meter">0 / 1.000m</div>
        </div>

        <div class="alt-bar-bg">
          <div class="alt-bar-fill" id="alt-fill"></div>
        </div>

        <div class="shield-row">
          <span>ESCUDOS DO GUERREIRO:</span>
          <div class="shield-icons" id="shield-icons">
            <span class="shield-pip">🛡️</span>
            <span class="shield-pip">🛡️</span>
            <span class="shield-pip">🛡️</span>
          </div>
        </div>
      </div>
    </header>

    <!-- Canvas Principal da Montanha Sagrada -->
    <canvas id="mountain-canvas"></canvas>

    <!-- Bottom Safe Zone (180px) -->
    <footer class="bottom-panel">
      <!-- Grade de Ações de Escalada (1, 2, 3) -->
      <div class="climb-controls-grid">
        <div class="climb-card" id="climb-btn-1" onclick="climbAction(1)">
          <div class="climb-key">1</div>
          <div class="climb-label">ESQUERDA</div>
          <div class="climb-sub">DESVIAR ESQ</div>
        </div>

        <div class="climb-card" id="climb-btn-2" onclick="climbAction(2)">
          <div class="climb-key">2</div>
          <div class="climb-label">SUBIR</div>
          <div class="climb-sub">+5M SALTO</div>
        </div>

        <div class="climb-card" id="climb-btn-3" onclick="climbAction(3)">
          <div class="climb-key">3</div>
          <div class="climb-label">DIREITA</div>
          <div class="climb-sub">DESVIAR DIR</div>
        </div>
      </div>

      <!-- Leaderboard MVP Rápido -->
      <div class="mvp-bar">
        <div class="mvp-label">🧗 MVP DA ESCALADA:</div>
        <div class="mvp-user" id="mvp-user">@aguardando_chat</div>
        <div class="mvp-score" id="mvp-score">0m</div>
      </div>

      <!-- Gaveta de Depuração Local -->
      <div class="debug-drawer">
        <button class="debug-btn" onclick="climbAction(1)">⬅️ Esq (1)</button>
        <button class="debug-btn" onclick="climbAction(2)">⬆️ Subir (2)</button>
        <button class="debug-btn" onclick="climbAction(3)">➡️ Dir (3)</button>
        <button class="debug-btn" onclick="triggerPhoenixGift()">🦅 Fênix (+150m)</button>
        <button class="debug-btn" onclick="resetClimb()">🔄 Reset</button>
      </div>
    </footer>

    <!-- Overlay de Fim de Partida -->
    <div id="summit-overlay">
      <div class="overlay-badge" id="overlay-badge">👑</div>
      <div class="overlay-title" id="overlay-title">CUME ALCANÇADO!</div>
      <div style="font-size: 13px; color: #cbd5e1;" id="overlay-sub">A comunidade conquistou o pico sagrado com maestria!</div>

      <div class="podium-box">
        <div style="font-size: 11px; font-weight: 800; color: #facc15; text-align: center;">TOP ESCALADORES DA LIVE</div>
        <div id="podium-content"></div>
      </div>

      <div class="auto-reset-bar">
        <div class="auto-reset-fill" id="reset-fill"></div>
      </div>
    </div>
  </div>

  <script>
    // =========================================================================
    // 1. SINTETIZADOR DE ÁUDIO PROCEDURAL (Web Audio API - Zero Arquivos Externos)
    // =========================================================================
    class MountainAudioSynthesizer {
      constructor() {
        this.ctx = null;
      }

      init() {
        if (!this.ctx) {
          const AudioContextClass = window.AudioContext || window.webkitAudioContext;
          this.ctx = new AudioContextClass();
        }
        if (this.ctx.state === 'suspended') {
          this.ctx.resume();
        }
      }

      // Salto de escalada / propulsão
      playJump() {
        this.init();
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();

        osc.type = 'sine';
        osc.frequency.setValueAtTime(260, now);
        osc.frequency.exponentialRampToValueAtTime(620, now + 0.12);

        gain.gain.setValueAtTime(0.3, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.12);

        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(now);
        osc.stop(now + 0.13);
      }

      // Impacto de rocha / avalanche no escudo
      playRockHit() {
        this.init();
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();

        osc.type = 'triangle';
        osc.frequency.setValueAtTime(140, now);
        osc.frequency.exponentialRampToValueAtTime(30, now + 0.3);

        gain.gain.setValueAtTime(0.6, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.3);

        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(now);
        osc.stop(now + 0.31);
      }

      // Voo Místico da Fênix Dourada (Gifts)
      playPhoenixAscend() {
        this.init();
        const freqs = [330, 440, 554.37, 659.25, 880, 1108.73];
        freqs.forEach((f, idx) => {
          const now = this.ctx.currentTime + (idx * 0.08);
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'triangle';
          osc.frequency.value = f;
          gain.gain.setValueAtTime(0.35, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.4);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(now);
          osc.stop(now + 0.42);
        });
      }

      // Fanfarra de Cume
      playSummitVictory() {
        this.init();
        const chord = [523.25, 659.25, 783.99, 1046.50];
        chord.forEach(f => {
          const now = this.ctx.currentTime;
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'sine';
          osc.frequency.value = f;
          gain.gain.setValueAtTime(0.3, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.8);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(now);
          osc.stop(now + 0.85);
        });
      }
    }

    const sound = new MountainAudioSynthesizer();

    // =========================================================================
    // 2. MOTOR DE ESCALADA VERTICAL & PARALLAX
    // =========================================================================
    const stage = document.getElementById('game-stage');
    const canvas = document.getElementById('mountain-canvas');
    const ctx = canvas.getContext('2d');

    function resizeCanvas() {
      canvas.width = stage.clientWidth;
      canvas.height = stage.clientHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    // Estado da Escalada
    let altitude = 0;          // 0m a 1000m
    const maxAltitude = 1000;
    let shields = 3;           // Vidas / Escudos
    let roundTimer = 45.0;
    let isGameOver = false;
    let winner = null;         // 'CHAT' ou 'AVALANCHE'
    let shakeIntensity = 0;
    let invulnerableTimer = 0;

    // Posição do Guerreiro (3 Lanes: 0 = Esq, 1 = Centro, 2 = Dir)
    let heroLane = 1;
    let heroX = 0.5;           // Proporção de 0.0 a 1.0
    let targetX = 0.5;
    const laneCoords = [0.25, 0.50, 0.75];

    // MVP Trackers
    const climbers = new Map(); // user -> metersContributed
    let topClimbers = [];

    // Avalanches e Pedregulhos
    const boulders = [];
    const particles = [];
    let boulderTimer = 0;

    function spawnBoulder() {
      if (isGameOver) return;
      const lane = Math.floor(Math.random() * 3);
      boulders.push({
        lane: lane,
        x: laneCoords[lane] * canvas.width,
        y: 140, // Top Safe Zone
        vy: 240 + Math.random() * 140,
        size: 20 + Math.random() * 12,
        rotation: 0,
        rotSpeed: (Math.random() - 0.5) * 6
      });
    }

    // =========================================================================
    // 3. AÇÕES DE ESCALADA PELO PÚBLICO
    // =========================================================================
    function climbAction(actionType, user = '@espectador', isGift = false) {
      if (isGameOver) return;
      lastInteractionTime = Date.now();

      // Feedback visual
      const btn = document.getElementById(`climb-btn-${actionType}`);
      if (btn) {
        btn.classList.add('climb-card-active');
        setTimeout(() => btn.classList.remove('climb-card-active'), 150);
      }

      let gainMeters = 0;

      if (actionType === 1) {
        // Desviar Esquerda
        heroLane = Math.max(0, heroLane - 1);
        gainMeters = 2;
        sound.playJump();
      } else if (actionType === 2) {
        // Salto Vertical
        gainMeters = 6;
        sound.playJump();
      } else if (actionType === 3) {
        // Desviar Direita
        heroLane = Math.min(2, heroLane + 1);
        gainMeters = 2;
        sound.playJump();
      }

      altitude = Math.min(maxAltitude, altitude + gainMeters);
      recordClimber(user, gainMeters);

      // Partículas de poeira cósmica ao saltar
      spawnDustParticles(heroX * canvas.width, canvas.height - 240, '#facc15');

      if (altitude >= maxAltitude) {
        endClimb(true);
      }
    }

    function triggerPhoenixGift(user = '@whale_phoenix') {
      if (isGameOver) return;
      lastInteractionTime = Date.now();

      sound.playPhoenixAscend();
      invulnerableTimer = 3.5;
      const boostMeters = 150;
      altitude = Math.min(maxAltitude, altitude + boostMeters);
      shakeIntensity = 18;

      recordClimber(user, boostMeters);
      spawnDustParticles(heroX * canvas.width, canvas.height - 240, '#f43f5e', 40);

      if (altitude >= maxAltitude) {
        endClimb(true);
      }
    }

    function recordClimber(user, meters) {
      let c = climbers.get(user);
      if (!c) {
        c = { user, meters: 0 };
        climbers.set(user, c);
      }
      c.meters += meters;

      topClimbers = Array.from(climbers.values())
        .sort((a, b) => b.meters - a.meters)
        .slice(0, 3);

      if (topClimbers[0]) {
        document.getElementById('mvp-user').innerText = topClimbers[0].user;
        document.getElementById('mvp-score').innerText = `${topClimbers[0].meters}m`;
      }
    }

    function spawnDustParticles(x, y, color, count = 10) {
      for (let i = 0; i < count; i++) {
        const ang = Math.PI * 0.5 + (Math.random() - 0.5) * 1.5;
        const spd = 40 + Math.random() * 120;
        particles.push({
          x: x,
          y: y,
          vx: Math.cos(ang) * spd,
          vy: Math.sin(ang) * spd,
          color: color,
          size: 3 + Math.random() * 4,
          alpha: 1.0,
          life: 0,
          maxLife: 0.5
        });
      }
    }

    // =========================================================================
    // 4. LOOP DE FÍSICA & ATUALIZAÇÃO
    // =========================================================================
    let lastTime = performance.now();

    function updateClimb(timestamp) {
      const dt = Math.min(0.1, (timestamp - lastTime) / 1000);
      lastTime = timestamp;

      // Suavizar movimentação lateral do guerreiro
      targetX = laneCoords[heroLane];
      heroX += (targetX - heroX) * Math.min(1.0, 15.0 * dt);

      // Tremor de tela decay
      if (shakeIntensity > 0) {
        shakeIntensity = Math.max(0, shakeIntensity - (25 * dt));
        const sx = (Math.random() - 0.5) * shakeIntensity;
        const sy = (Math.random() - 0.5) * shakeIntensity;
        stage.style.transform = `translate(${sx}px, ${sy}px)`;
      } else {
        stage.style.transform = 'none';
      }

      if (invulnerableTimer > 0) {
        invulnerableTimer -= dt;
      }

      if (!isGameOver) {
        // Cronômetro
        roundTimer -= dt;
        if (roundTimer <= 0) {
          roundTimer = 0;
          endClimb(false);
          return;
        }

        // Spawner de Pedregulhos da Avalanche
        boulderTimer += dt;
        const spawnRate = Math.max(0.4, 1.2 - (altitude / maxAltitude) * 0.6);
        if (boulderTimer >= spawnRate) {
          boulderTimer = 0;
          spawnBoulder();
        }

        // Atualizar Pedregulhos
        const heroScreenX = heroX * canvas.width;
        const heroScreenY = canvas.height - 240;

        for (let i = boulders.length - 1; i >= 0; i--) {
          const b = boulders[i];
          b.y += b.vy * dt;
          b.rotation += b.rotSpeed * dt;

          // Colisão com o guerreiro
          const dist = Math.hypot(b.x - heroScreenX, b.y - heroScreenY);
          if (dist < b.size + 18) {
            if (invulnerableTimer <= 0) {
              shields--;
              sound.playRockHit();
              shakeIntensity = 18;
              spawnDustParticles(heroScreenX, heroScreenY, '#ef4444', 20);

              if (shields <= 0) {
                endClimb(false);
                break;
              }
            }
            boulders.splice(i, 1);
            continue;
          }

          // Passou da base
          if (b.y > canvas.height - 180) {
            boulders.splice(i, 1);
          }
        }
      }

      // Atualizar Partículas
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.life += dt;
        p.x += p.vx * dt;
        p.y += p.vy * dt;
        p.alpha = Math.max(0, 1.0 - (p.life / p.maxLife));
        if (p.life >= p.maxLife) particles.splice(i, 1);
      }

      render();
      updateHUD();
      requestAnimationFrame(updateClimb);
    }
    requestAnimationFrame(updateClimb);

    // =========================================================================
    // 5. RENDERIZAÇÃO VETORIAL DA MONTANHA SAGRADA
    // =========================================================================
    let bgScroll = 0;

    function render() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      bgScroll += 1.5;

      // Parallax de Paredão de Pedra e Runas Místicas
      ctx.strokeStyle = 'rgba(250, 204, 21, 0.08)';
      ctx.lineWidth = 1;
      for (let i = 0; i < 6; i++) {
        const yLine = ((i * 120 + bgScroll) % (canvas.height - 320)) + 140;
        ctx.beginPath();
        ctx.moveTo(30, yLine);
        ctx.lineTo(canvas.width - 30, yLine);
        ctx.stroke();
      }

      // Linhas Verticais das 3 Trilhas
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.06)';
      ctx.lineWidth = 2;
      ctx.setLineDash([10, 10]);
      [0.375, 0.625].forEach(r => {
        ctx.beginPath();
        ctx.moveTo(canvas.width * r, 140);
        ctx.lineTo(canvas.width * r, canvas.height - 180);
        ctx.stroke();
      });
      ctx.setLineDash([]);

      // Desenhar Pedregulhos
      boulders.forEach(b => {
        ctx.save();
        ctx.translate(b.x, b.y);
        ctx.rotate(b.rotation);
        ctx.fillStyle = '#64748b';
        ctx.strokeStyle = '#ef4444';
        ctx.lineWidth = 2;
        ctx.shadowColor = '#ef4444';
        ctx.shadowBlur = 10;

        ctx.beginPath();
        ctx.arc(0, 0, b.size, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();
        ctx.restore();
      });

      // Desenhar Partículas
      particles.forEach(p => {
        ctx.save();
        ctx.globalAlpha = p.alpha;
        ctx.fillStyle = p.color;
        ctx.shadowColor = p.color;
        ctx.shadowBlur = 8;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      });

      // Desenhar Guerreiro Sagrado
      const hx = heroX * canvas.width;
      const hy = canvas.height - 240;

      ctx.save();
      ctx.translate(hx, hy);

      // Escudo Quântico / Aura da Fênix
      if (invulnerableTimer > 0) {
        ctx.strokeStyle = '#facc15';
        ctx.lineWidth = 4;
        ctx.shadowColor = '#facc15';
        ctx.shadowBlur = 25;
        ctx.beginPath();
        ctx.arc(0, 0, 36, 0, Math.PI * 2);
        ctx.stroke();
      }

      // Corpo do Guerreiro
      ctx.fillStyle = '#facc15';
      ctx.shadowColor = '#facc15';
      ctx.shadowBlur = 15;

      // Capa esvoaçante
      ctx.fillStyle = '#7c3aed';
      ctx.beginPath();
      ctx.moveTo(-12, -10);
      ctx.lineTo(12, -10);
      ctx.lineTo(16, 25);
      ctx.lineTo(-16, 25);
      ctx.closePath();
      ctx.fill();

      // Cabeça / Elmo
      ctx.fillStyle = '#facc15';
      ctx.beginPath();
      ctx.arc(0, -18, 10, 0, Math.PI * 2);
      ctx.fill();

      // Espada nas costas
      ctx.strokeStyle = '#38bdf8';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(-14, -22);
      ctx.lineTo(14, 18);
      ctx.stroke();

      ctx.restore();
    }

    // =========================================================================
    // 6. ATUALIZAÇÃO DA HUD & DOM
    // =========================================================================
    const altFill = document.getElementById('alt-fill');
    const altMeter = document.getElementById('alt-meter');
    const timerVal = document.getElementById('timer-val');
    const shieldIcons = document.getElementById('shield-icons');

    function updateHUD() {
      const pct = (altitude / maxAltitude) * 100;
      altFill.style.width = `${pct}%`;
      altMeter.innerText = `${altitude} / ${maxAltitude}m`;
      timerVal.innerText = `${roundTimer.toFixed(1)}s`;

      // Escudos
      let sHtml = '';
      for (let i = 0; i < 3; i++) {
        sHtml += `<span class="${i < shields ? 'shield-pip' : 'shield-lost'}">🛡️</span>`;
      }
      shieldIcons.innerHTML = sHtml;
    }

    // =========================================================================
    // 7. OVERLAY DE FIM DE PARTIDA & AUTO-RESET (5 Segundos)
    // =========================================================================
    const summitOverlay = document.getElementById('summit-overlay');
    const overlayBadge = document.getElementById('overlay-badge');
    const overlayTitle = document.getElementById('overlay-title');
    const overlaySub = document.getElementById('overlay-sub');
    const podiumContent = document.getElementById('podium-content');
    const resetFill = document.getElementById('reset-fill');

    function endClimb(isVictory) {
      isGameOver = true;
      winner = isVictory ? 'CHAT' : 'AVALANCHE';
      summitOverlay.classList.add('active');

      if (isVictory) {
        sound.playSummitVictory();
        overlayBadge.innerText = '👑';
        overlayTitle.innerText = 'CUME ALCANÇADO!';
        overlayTitle.className = 'overlay-title';
        overlaySub.innerText = 'A comunidade levou o guerreiro ao topo da Montanha Sagrada!';
      } else {
        overlayBadge.innerText = '💀';
        overlayTitle.innerText = 'AVALANCHE ESMAGADORA!';
        overlayTitle.className = 'overlay-title defeat-title';
        overlaySub.innerText = 'Os escudos cederam antes de alcançar o cume!';
      }

      podiumContent.innerHTML = '';
      if (topClimbers.length === 0) {
        podiumContent.innerHTML = '<div style="text-align: center; color: #94a3b8;">Nenhum escalador registrado</div>';
      } else {
        topClimbers.forEach((c, idx) => {
          const medal = ['🥇', '🥈', '🥉'][idx];
          podiumContent.innerHTML += `
            <div class="podium-item">
              <span style="font-weight: 800;">${medal} ${c.user}</span>
              <span style="color: #facc15; font-weight: 900;">${c.meters}m</span>
            </div>
          `;
        });
      }

      // Barra de Auto-Reset em 5s
      resetFill.style.transition = 'none';
      resetFill.style.width = '100%';
      void resetFill.offsetWidth;
      resetFill.style.transition = 'width 5s linear';
      resetFill.style.width = '0%';

      setTimeout(() => {
        resetClimb();
      }, 5000);
    }

    function resetClimb() {
      altitude = 0;
      shields = 3;
      roundTimer = 45.0;
      isGameOver = false;
      winner = null;
      heroLane = 1;
      boulders.length = 0;
      particles.length = 0;
      climbers.clear();
      topClimbers = [];
      summitOverlay.classList.remove('active');
      document.getElementById('mvp-user').innerText = '@aguardando_chat';
      document.getElementById('mvp-score').innerText = '0m';
    }

    // =========================================================================
    // 8. MOTOR ANTI-SILÊNCIO (Simulação Autônoma)
    // =========================================================================
    const mockUsers = ['@escalador_zen', '@ninja_vertical', '@valkiria_br', '@salto_mortal', '@peak_hunter'];
    let lastInteractionTime = Date.now();

    setInterval(() => {
      if (isGameOver) return;
      if (Date.now() - lastInteractionTime > 2000) {
        const randAct = 1 + Math.floor(Math.random() * 3);
        const randUser = mockUsers[Math.floor(Math.random() * mockUsers.length)];
        climbAction(randAct, randUser, false);
      }
    }, 1600);

    // =========================================================================
    // 9. V5 BROADCASTER EVENT BUS
    // =========================================================================
    const broadcasterChannel = new BroadcastChannel('v5_broadcaster_games');
    broadcasterChannel.onmessage = (event) => {
      handleIncomingEvent(event.data);
    };

    window.addEventListener('v5_event', (e) => {
      handleIncomingEvent(e.detail);
    });

    function handleIncomingEvent(data) {
      if (!data) return;
      lastInteractionTime = Date.now();

      const user = data.user || '@espectador';
      const comment = (data.comment || '').trim().toLowerCase();
      const isGift = data.type === 'gift';

      if (isGift) {
        // Presentes ativam o Voo Místico da Fênix
        triggerPhoenixGift(user);
      } else {
        if (comment.includes('1') || comment.includes('esq')) {
          climbAction(1, user, false);
        } else if (comment.includes('2') || comment.includes('subir') || comment.includes('salto')) {
          climbAction(2, user, false);
        } else if (comment.includes('3') || comment.includes('dir')) {
          climbAction(3, user, false);
        } else {
          // Qualquer outro comentário gera salto vertical
          climbAction(2, user, false);
        }
      }
    }
  </script>
</body>
