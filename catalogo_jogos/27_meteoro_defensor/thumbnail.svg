<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="100%" height="100%">
  <defs>
    <!-- Gradiente de Fundo -->
    <linearGradient id="bg-grad-27_meteoro_defensor" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#030712"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>

    <!-- Gradiente de Borda Neon -->
    <linearGradient id="border-grad-27_meteoro_defensor" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>

    <!-- Filtro de Brilho Neon -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Fundo com Borda Estilizada -->
  <rect x="5" y="5" width="390" height="490" rx="24" fill="url(#bg-grad-27_meteoro_defensor)" stroke="url(#border-grad-27_meteoro_defensor)" stroke-width="4"/>

  <!-- Grid Tecnológico Sutil -->
  <path d="M20 70 L380 70 M20 410 L380 410" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <circle cx="200" cy="245" r="140" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="2"/>

  <!-- Badge Topo Esquerda: V5 9:16 LIVE -->
  <rect x="25" y="25" width="115" height="26" rx="13" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
  <circle cx="40" cy="38" r="4" fill="#ef4444"/>
  <text x="52" y="42" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="800" letter-spacing="1">V5 9:16</text>

  <!-- Pill Categoria Topo Direita -->
  <rect x="255" y="25" width="120" height="26" rx="13" fill="rgba(255,255,255,0.08)" stroke="#38bdf8" stroke-width="1"/>
  <text x="315" y="42" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="900" letter-spacing="1" text-anchor="middle">ARCADE DEFESA</text>

  <!-- Elemento Central Simbólico do Jogo -->
  <g>
    
            <circle cx="200" cy="265" r="45" fill="#38bdf8" filter="url(#glow)"/>
            <text x="200" y="278" font-size="38" text-anchor="middle">🌍</text>
            <line x1="200" y1="220" x2="250" y2="160" stroke="#22c55e" stroke-width="4"/>
            <text x="260" y="165" font-size="28">☄️</text>
        
  </g>

  <!-- Título e Subtítulo Inferior -->
  <text x="200" y="445" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="900" letter-spacing="1" text-anchor="middle">METEORO DEFENSOR</text>
  <text x="200" y="470" fill="#ef4444" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" letter-spacing="2" text-anchor="middle">DEFESA PLANETÁRIA</text>
</svg>