<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="100%" height="100%">
  <defs>
    <!-- Gradiente de Fundo -->
    <linearGradient id="bg-grad-40_duelo_de_magicos_neon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#030712"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>

    <!-- Gradiente de Borda Neon -->
    <linearGradient id="border-grad-40_duelo_de_magicos_neon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff4500"/>
      <stop offset="50%" stop-color="#ffd700"/>
      <stop offset="100%" stop-color="#00e5ff"/>
    </linearGradient>

    <!-- Filtro de Brilho Neon -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Fundo com Borda Estilizada -->
  <rect x="5" y="5" width="390" height="490" rx="24" fill="url(#bg-grad-40_duelo_de_magicos_neon)" stroke="url(#border-grad-40_duelo_de_magicos_neon)" stroke-width="4"/>

  <!-- Grid Tecnológico Sutil -->
  <path d="M20 70 L380 70 M20 410 L380 410" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <circle cx="200" cy="245" r="140" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="2"/>

  <!-- Badge Topo Esquerda: V5 9:16 LIVE -->
  <rect x="25" y="25" width="115" height="26" rx="13" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
  <circle cx="40" cy="38" r="4" fill="#ef4444"/>
  <text x="52" y="42" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="800" letter-spacing="1">V5 9:16</text>

  <!-- Pill Categoria Topo Direita -->
  <rect x="255" y="25" width="120" height="26" rx="13" fill="rgba(255,255,255,0.08)" stroke="#ff4500" stroke-width="1"/>
  <text x="315" y="42" fill="#ff4500" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="900" letter-spacing="1" text-anchor="middle">POLARIZAÇÃO</text>

  <!-- Elemento Central Simbólico do Jogo -->
  <g>
    
            <line x1="200" y1="160" x2="200" y2="245" stroke="#ff4500" stroke-width="12" filter="url(#glow)"/>
            <line x1="200" y1="330" x2="200" y2="245" stroke="#00e5ff" stroke-width="12" filter="url(#glow)"/>
            <circle cx="200" cy="245" r="28" fill="#ffffff" filter="url(#glow)"/>
            <text x="200" y="180" font-size="28" text-anchor="middle">🧙‍♂️</text>
            <text x="200" y="325" font-size="28" text-anchor="middle">🧙</text>
        
  </g>

  <!-- Título e Subtítulo Inferior -->
  <text x="200" y="445" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="900" letter-spacing="1" text-anchor="middle">DUELO DE MÁGICOS</text>
  <text x="200" y="470" fill="#ffd700" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" letter-spacing="2" text-anchor="middle">FOGO VS GELO</text>
</svg>