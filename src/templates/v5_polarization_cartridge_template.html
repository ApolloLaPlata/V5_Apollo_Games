<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>V5 Live: Template Base de Polarização (9:16)</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      background-color: #020617;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      width: 100vw;
      height: 100vh;
    }

    #game-stage {
      position: relative;
      width: 100vw;
      height: 100vh;
      max-width: calc(100vh * (9 / 16));
      background: radial-gradient(circle at 50% 30%, #0f172a 0%, #020617 100%);
      border: 1px solid rgba(255, 255, 255, 0.08);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      overflow: hidden;
      box-shadow: 0 0 50px rgba(0, 0, 0, 0.9);
    }

    /* Top Safe Zone (140px) */
    .top-header {
      padding: 18px 16px 8px 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      z-index: 10;
      background: linear-gradient(180deg, rgba(2, 6, 23, 0.95) 0%, rgba(2, 6, 23, 0) 100%);
    }

    .brand-row {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .brand-tag {
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: #94a3b8;
      font-family: monospace;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .live-dot {
      width: 8px;
      height: 8px;
      background: #ef4444;
      border-radius: 50%;
      box-shadow: 0 0 10px #ef4444;
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.85); }
    }

    .timer-badge {
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid rgba(239, 68, 68, 0.4);
      color: #fca5a5;
      font-size: 13px;
      font-weight: 800;
      padding: 4px 12px;
      border-radius: 20px;
      font-variant-numeric: tabular-nums;
      display: flex;
      align-items: center;
      gap: 5px;
    }

    /* Placar Polarizado */
    .score-board {
      width: 100%;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      align-items: center;
      background: rgba(15, 23, 42, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 16px;
      padding: 10px 16px;
      backdrop-filter: blur(10px);
    }

    .team-box {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .team-a {
      color: #38bdf8;
      text-shadow: 0 0 14px rgba(56, 189, 248, 0.6);
    }

    .team-b {
      color: #fb923c;
      text-shadow: 0 0 14px rgba(251, 146, 60, 0.6);
    }

    .box-title {
      font-size: 11px;
      text-transform: uppercase;
      font-weight: 800;
      letter-spacing: 1px;
    }

    .box-score {
      font-size: 22px;
      font-weight: 900;
      font-family: monospace;
      margin-top: 2px;
    }

    /* Arena Central */
    #arena-container {
      position: absolute;
      inset: 0;
      z-index: 1;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    /* Bottom Safe Zone (180px) */
    .bottom-panel {
      padding: 12px 16px 20px 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      z-index: 10;
      background: linear-gradient(0deg, rgba(2, 6, 23, 0.98) 0%, rgba(2, 6, 23, 0.7) 70%, rgba(2, 6, 23, 0) 100%);
      pointer-events: none;
    }

    .chat-instructions {
      display: flex;
      justify-content: space-between;
      gap: 8px;
    }

    .cmd-pill {
      flex: 1;
      background: rgba(30, 41, 59, 0.8);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 12px;
      padding: 10px 8px;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
    }

    .cmd-pill.a {
      border-color: rgba(56, 189, 248, 0.4);
      background: rgba(56, 189, 248, 0.1);
    }

    .cmd-pill.b {
      border-color: rgba(251, 146, 60, 0.4);
      background: rgba(251, 146, 60, 0.1);
    }

    .gift-cta {
      background: linear-gradient(90deg, rgba(234, 88, 12, 0.25) 0%, rgba(251, 191, 36, 0.3) 50%, rgba(234, 88, 12, 0.25) 100%);
      border: 1px solid rgba(251, 191, 36, 0.4);
      border-radius: 12px;
      padding: 8px 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    /* Toasts */
    .toast-container {
      position: absolute;
      top: 145px;
      width: calc(100% - 32px);
      left: 16px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      pointer-events: none;
      z-index: 20;
    }

    .toast-item {
      background: rgba(15, 23, 42, 0.92);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 10px;
      padding: 8px 12px;
      font-size: 12px;
      font-weight: 700;
    }

    /* Overlay Vitória */
    #victory-overlay {
      position: absolute;
      inset: 0;
      background: rgba(2, 6, 23, 0.92);
      backdrop-filter: blur(12px);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 24px;
      z-index: 100;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.4s ease;
    }

    #victory-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .victory-box {
      background: rgba(15, 23, 42, 0.95);
      border: 2px solid #fbbf24;
      border-radius: 24px;
      padding: 32px 24px;
      text-align: center;
    }

    .reset-progress-bar {
      width: 100%;
      height: 8px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 4px;
      overflow: hidden;
      margin-top: 15px;
    }

    .reset-progress-fill {
      height: 100%;
      background: #fbbf24;
      width: 0%;
      transition: width 5s linear;
    }
  </style>
</head>
<body>

  <div id="game-stage">
    
    <!-- Top Safe Zone -->
    <header class="top-header">
      <div class="brand-row">
        <div class="brand-tag">
          <span class="live-dot"></span>
          V5 LIVE DISPUTA
        </div>
        <div class="timer-badge">
          ⏳ <span id="round-timer">45</span>s
        </div>
      </div>

      <div class="score-board">
        <div class="team-box team-a">
          <span class="box-title">🔵 Time Azul</span>
          <span class="box-score" id="score-a">0</span>
        </div>
        <div class="team-box team-b">
          <span class="box-title">🟠 Time Laranja</span>
          <span class="box-score" id="score-b">0</span>
        </div>
      </div>
    </header>

    <!-- Canvas Central -->
    <div id="arena-container">
      <canvas id="arena-canvas"></canvas>
    </div>

    <div class="toast-container" id="toast-container"></div>

    <!-- Bottom Safe Zone -->
    <footer class="bottom-panel">
      <div class="chat-instructions">
        <div class="cmd-pill a">
          <span style="font-size: 16px; font-weight: 900; color: #38bdf8;">1</span>
          <span style="font-size: 10px; color: #cbd5e1; font-weight: 700;">Time Azul</span>
        </div>
        <div class="cmd-pill b">
          <span style="font-size: 16px; font-weight: 900; color: #fb923c;">2</span>
          <span style="font-size: 10px; color: #cbd5e1; font-weight: 700;">Time Laranja</span>
        </div>
      </div>

      <div class="gift-cta">
        <span style="font-size: 11px; font-weight: 700; color: #fef08a;">🎁 Presentes = Super Tração (5x a 50x)</span>
        <span style="background: #f59e0b; color: #000; font-weight: 900; font-size: 10px; padding: 3px 8px; border-radius: 8px;">TURBO</span>
      </div>
    </footer>

    <!-- Overlay Vitória -->
    <div id="victory-overlay">
      <div class="victory-box">
        <div style="font-size: 52px; margin-bottom: 10px;">👑</div>
        <h2 id="victory-title" style="font-size: 26px; font-weight: 900;">TIME AZUL VENCEU!</h2>
        <p id="victory-detail" style="font-size: 14px; color: #94a3b8; margin: 10px 0 15px 0;">Placar final consolidado</p>
        <div class="reset-progress-bar">
          <div class="reset-progress-fill" id="reset-fill"></div>
        </div>
      </div>
    </div>

  </div>

  <script>
    // Placeholder de script de template
  </script>
</body>
</html>
